<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Muse robotics planning and execution flow</title>
  <desc id="desc">A visitor request flows to Muse Spark, through strict plan validation, into deterministic robot skills, then a MuJoCo Panda simulation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b40"/>
      <stop offset="1" stop-color="#0064e0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ed0ff"/>
    </marker>
  </defs>
  <rect width="1400" height="420" rx="30" fill="url(#background)"/>
  <text x="70" y="72" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">From language to reliable robot motion</text>
  <text x="70" y="112" fill="#d9ecff" font-family="Arial, sans-serif" font-size="20">The model chooses a skill. Deterministic code owns execution and verification.</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="165" width="250" height="165" rx="22" fill="#fff"/>
    <text x="100" y="215" fill="#172b4d" font-size="24" font-weight="700">1 · Request</text>
    <text x="100" y="255" fill="#536273" font-size="18">“Put the red and blue</text>
    <text x="100" y="282" fill="#536273" font-size="18">blocks in the bin.”</text>

    <rect x="390" y="165" width="250" height="165" rx="22" fill="#fff"/>
    <text x="420" y="215" fill="#172b4d" font-size="24" font-weight="700">2 · Muse Spark</text>
    <text x="420" y="255" fill="#536273" font-size="18">Structured JSON plan</text>
    <text x="420" y="282" fill="#536273" font-size="18">with one allowed skill</text>

    <rect x="710" y="165" width="250" height="165" rx="22" fill="#fff"/>
    <text x="740" y="215" fill="#172b4d" font-size="24" font-weight="700">3 · Validate</text>
    <text x="740" y="255" fill="#536273" font-size="18">Strict schema, allowlist,</text>
    <text x="740" y="282" fill="#536273" font-size="18">and bounded arguments</text>

    <rect x="1030" y="165" width="300" height="165" rx="22" fill="#fff"/>
    <text x="1060" y="215" fill="#172b4d" font-size="24" font-weight="700">4 · Simulate</text>
    <text x="1060" y="255" fill="#536273" font-size="18">Deterministic skills drive</text>
    <text x="1060" y="282" fill="#536273" font-size="18">the MuJoCo Panda and verify</text>
    <text x="1060" y="309" fill="#536273" font-size="18">the final block positions</text>
  </g>
  <g stroke="#9ed0ff" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M330 248 H375"/>
    <path d="M650 248 H695"/>
    <path d="M970 248 H1015"/>
  </g>
</svg>
