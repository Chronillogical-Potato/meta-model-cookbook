<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Full Muse robotics demo flow</title>
  <desc id="desc">Voice or kiosk input flows through local routing to robot motion, a styled portrait, or postcard printing, with Reachy reactions and a presentation-only SAM preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06152f"/><stop offset="1" stop-color="#0b66d8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".23"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#88cfff"/></marker>
  </defs>
  <rect width="1500" height="760" rx="34" fill="url(#bg)"/>
  <text x="72" y="78" fill="white" font-family="Arial,sans-serif" font-size="38" font-weight="700">One session, three safe workflows</text>
  <text x="72" y="118" fill="#cfe7ff" font-family="Arial,sans-serif" font-size="20">Fixture-driven by default · live APIs and physical hardware are explicit opt-ins</text>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(70 170)"><rect width="270" height="150" rx="24" fill="white"/><text x="28" y="50" fill="#122947" font-size="24" font-weight="700">Input</text><text x="28" y="88" fill="#536b84" font-size="18">Muse Voice transcript</text><text x="28" y="117" fill="#536b84" font-size="18">or kiosk action</text></g>
    <g transform="translate(420 170)"><rect width="270" height="150" rx="24" fill="white"/><text x="28" y="50" fill="#122947" font-size="24" font-weight="700">Route</text><text x="28" y="88" fill="#536b84" font-size="18">Local known intents</text><text x="28" y="117" fill="#536b84" font-size="18">Muse Spark fallback</text></g>
    <g transform="translate(810 150)"><rect width="300" height="190" rx="24" fill="#eaf5ff"/><text x="28" y="48" fill="#0a5bb8" font-size="24" font-weight="700">Robot task</text><text x="28" y="84" fill="#536b84" font-size="18">Strict plan validation</text><text x="28" y="113" fill="#536b84" font-size="18">SAM preview (display only)</text><text x="28" y="142" fill="#536b84" font-size="18">MuJoCo skill + verification</text><text x="28" y="171" fill="#536b84" font-size="18">Reachy reaction</text></g>
    <g transform="translate(810 390)"><rect width="300" height="190" rx="24" fill="#fff3e5"/><text x="28" y="48" fill="#b45b00" font-size="24" font-weight="700">Styled portrait</text><text x="28" y="84" fill="#6d6256" font-size="18">Browser or Reachy camera</text><text x="28" y="113" fill="#6d6256" font-size="18">Face gate</text><text x="28" y="142" fill="#6d6256" font-size="18">Muse Image 1.0</text><text x="28" y="171" fill="#6d6256" font-size="18">In-memory input by default</text></g>
    <g transform="translate(1190 270)"><rect width="240" height="190" rx="24" fill="#eafbea"/><text x="28" y="48" fill="#14723a" font-size="24" font-weight="700">Postcard</text><text x="28" y="84" fill="#566b5c" font-size="18">No-crop 300 DPI</text><text x="28" y="113" fill="#566b5c" font-size="18">Explicit QR URL</text><text x="28" y="142" fill="#566b5c" font-size="18">File output default</text><text x="28" y="171" fill="#566b5c" font-size="18">CUPS opt-in</text></g>
  </g>
  <g fill="none" stroke="#88cfff" stroke-width="5" marker-end="url(#arrow)"><path d="M350 245H405"/><path d="M700 245H790"/><path d="M700 265 C750 265 750 485 790 485"/><path d="M1120 485 C1170 485 1150 400 1170 385"/></g>
  <text x="72" y="700" fill="#cfe7ff" font-family="Arial,sans-serif" font-size="19">Safety boundary: models choose bounded intents; deterministic code owns robot motion, verification, retention, and printing.</text>
</svg>
